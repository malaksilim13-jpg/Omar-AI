workflows:
  android-apk:
    name: Omar AI APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 21

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Create Gradle Wrapper
        script: |
          curl -L https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle
          /tmp/gradle/gradle-9.3.1/bin/gradle wrapper --gradle-version 9.3.1

      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug

    artifacts:
      - app/build/outputs/**/*.apk
